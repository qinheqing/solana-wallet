[package]
name = "solwallet-cpi"
version = "0.1.0"
edition = "2021"
description = "Minimal Solana BPF program (pinocchio): authority-gated batch SOL payouts from an owned PDA vault + a TransferChecked CPI forwarder"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pinocchio = { version = "0.7.1", features = ["std"] }

[profile.release]
overflow-checks = true

[dev-dependencies]
mollusk-svm = "0.17.1"
solana-sdk = "5.0.0"
solana-sdk-ids = "3.1.0"
mollusk-svm-programs-token = "0.17.1"
